name: ratebridge
description: B2B Construction Material Procurement SaaS Platform for Pakistan
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.1.3
  firebase_dynamic_links: ^6.0.4
  cloud_functions: ^5.1.3

  # UI
  url_launcher: ^6.3.1

  # AI
  http: ^1.2.2

  # Charts
  fl_chart: ^0.69.0

  # Voice
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

  # Localization
  intl: ^0.20.2

  # Share
  share_plus: ^10.0.0

  # Images
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1

  # Local Storage
  shared_preferences: ^2.3.2

  # Utilities
  uuid: ^4.4.2
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.0.3
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/